<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Dashboard</title>

    <style>
        /* ---------- RESET ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* ---------- BODY ---------- */
        body {
            background: #f4f6f9;
            color: #333;
        }

        /* ---------- HEADER ---------- */
        header {
            background: #1e3a8a;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 17px;
        }

        /* ---------- MAIN CONTAINER ---------- */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        /* ---------- DASHBOARD CARDS ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #555;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            color: #1e3a8a;
        }

        /* ---------- FORM CARD ---------- */
        .form-card,
        .table-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-card h2,
        .table-card h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        /* ---------- FORM ---------- */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1e3a8a;
        }

        /* ---------- ADD BUTTON ---------- */
        .add-btn {
            margin-top: 20px;
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-btn:hover {
            background: #162d6b;
        }

        /* ---------- TABLE ---------- */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        tbody tr:hover {
            background: #f1f5f9;
        }

        /* ---------- STATUS ---------- */
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
        }

        .placed {
            background: #dcfce7;
            color: #15803d;
        }

        .not-placed {
            background: #fee2e2;
            color: #dc2626;
        }

        /* ---------- DELETE BUTTON ---------- */
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #991b1b;
        }

        /* ---------- ERROR MESSAGE ---------- */
        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {

            .container {
                width: 95%;
            }

            header h1 {
                font-size: 22px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            th,
            td {
                padding: 9px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>
        <h1>Jai Shriram Engineering College</h1>
        <p>Student Placement Dashboard</p>
    </header>


    <!-- ================= MAIN ================= -->
    <main class="container">

        <!-- ================= STATISTICS ================= -->
        <section class="stats">

            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalStudents">2</p>
            </div>

            <div class="stat-card">
                <h3>Placed Students</h3>
                <p id="placedStudents">1</p>
            </div>

            <div class="stat-card">
                <h3>Not Placed Students</h3>
                <p id="notPlacedStudents">1</p>
            </div>

        </section>


        <!-- ================= REGISTRATION FORM ================= -->
        <section class="form-card">

            <h2>Student Registration</h2>

            <form id="studentForm">

                <div class="form-grid">

                    <!-- Student Name -->
                    <div class="form-group">
                        <label for="studentName">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter student name"
                        >
                    </div>


                    <!-- Register Number -->
                    <div class="form-group">
                        <label for="registerNumber">
                            Register Number
                        </label>

                        <input
                            type="text"
                            id="registerNumber"
                            placeholder="Enter register number"
                        >
                    </div>


                    <!-- Department -->
                    <div class="form-group">
                        <label for="department">
                            Department
                        </label>

                        <select id="department">
                            <option value="">
                                Select Department
                            </option>

                            <option value="CSE">
                                CSE
                            </option>

                            <option value="ECE">
                                ECE
                            </option>

                            <option value="EEE">
                                EEE
                            </option>

                            <option value="MECH">
                                MECH
                            </option>

                            <option value="CIVIL">
                                CIVIL
                            </option>
                        </select>
                    </div>


                    <!-- CGPA -->
                    <div class="form-group">
                        <label for="cgpa">
                            CGPA
                        </label>

                        <input
                            type="number"
                            id="cgpa"
                            placeholder="Enter CGPA"
                            min="0"
                            max="10"
                            step="0.01"
                        >
                    </div>


                    <!-- Placement Status -->
                    <div class="form-group">
                        <label for="status">
                            Placement Status
                        </label>

                        <select id="status">
                            <option value="">
                                Select Status
                            </option>

                            <option value="Placed">
                                Placed
                            </option>

                            <option value="Not Placed">
                                Not Placed
                            </option>
                        </select>
                    </div>

                </div>


                <!-- Error Message -->
                <p id="errorMessage" class="error"></p>


                <!-- Add Button -->
                <button
                    type="submit"
                    class="add-btn"
                >
                    Add Student
                </button>

            </form>

        </section>


        <!-- ================= STUDENT TABLE ================= -->
        <section class="table-card">

            <h2>Student Placement Details</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Register No</th>
                            <th>Student Name</th>
                            <th>Department</th>
                            <th>CGPA</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>


                    <tbody id="studentTableBody">

                        <!-- Initial Student 1 -->
                        <tr>
                            <td>101</td>
                            <td>Arun</td>
                            <td>CSE</td>
                            <td>8.5</td>

                            <td>
                                <span class="status placed">
                                    Placed
                                </span>
                            </td>

                            <td>
                                <button
                                    class="delete-btn"
                                    onclick="deleteStudent(this)"
                                >
                                    Delete
                                </button>
                            </td>
                        </tr>


                        <!-- Initial Student 2 -->
                        <tr>
                            <td>102</td>
                            <td>Priya</td>
                            <td>ECE</td>
                            <td>9.0</td>

                            <td>
                                <span class="status not-placed">
                                    Not Placed
                                </span>
                            </td>

                            <td>
                                <button
                                    class="delete-btn"
                                    onclick="deleteStudent(this)"
                                >
                                    Delete
                                </button>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->
    <script>

        const studentForm =
            document.getElementById("studentForm");

        const studentTableBody =
            document.getElementById("studentTableBody");

        const errorMessage =
            document.getElementById("errorMessage");


        /* =========================================
           FORM SUBMISSION
        ========================================= */

        studentForm.addEventListener("submit", function(event) {

            // Stop page refresh
            event.preventDefault();


            // Get values
            const name =
                document.getElementById("studentName").value.trim();

            const registerNumber =
                document.getElementById("registerNumber").value.trim();

            const department =
                document.getElementById("department").value;

            const cgpa =
                document.getElementById("cgpa").value;

            const status =
                document.getElementById("status").value;


            /* =========================================
               VALIDATION
            ========================================= */

            // Check empty fields
            if (
                name === "" ||
                registerNumber === "" ||
                department === "" ||
                cgpa === "" ||
                status === ""
            ) {

                errorMessage.textContent =
                    "Please fill all fields.";

                return;
            }


            // Convert CGPA into number
            const cgpaValue = Number(cgpa);


            // Check CGPA range
            if (cgpaValue < 0 || cgpaValue > 10) {

                errorMessage.textContent =
                    "CGPA must be between 0 and 10.";

                return;
            }


            // Clear error
            errorMessage.textContent = "";


            /* =========================================
               CREATE TABLE ROW
            ========================================= */

            const row =
                document.createElement("tr");


            // Decide status class
            const statusClass =
                status === "Placed"
                ? "placed"
                : "not-placed";


            row.innerHTML = `

                <td>${registerNumber}</td>

                <td>${name}</td>

                <td>${department}</td>

                <td>${cgpaValue.toFixed(2)}</td>

                <td>
                    <span class="status ${statusClass}">
                        ${status}
                    </span>
                </td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteStudent(this)"
                    >
                        Delete
                    </button>
                </td>

            `;


            // Add row to table
            studentTableBody.appendChild(row);


            // Clear form
            studentForm.reset();


            // Update statistics
            updateStatistics();

        });


        /* =========================================
           DELETE STUDENT
        ========================================= */

        function deleteStudent(button) {

            // Get table row
            const row = button.parentElement.parentElement;


            // Remove row
            row.remove();


            // Update statistics
            updateStatistics();
        }


        /* =========================================
           UPDATE STATISTICS
        ========================================= */

        function updateStatistics() {

            // Get all table rows
            const rows =
                studentTableBody.querySelectorAll("tr");


            // Total students
            const total =
                rows.length;


            // Placed students
            let placed = 0;


            // Not placed students
            let notPlaced = 0;


            // Check every row
            rows.forEach(function(row) {

                const status =
                    row.cells[4].innerText.trim();


                if (status === "Placed") {
                    placed++;
                }

                else if (status === "Not Placed") {
                    notPlaced++;
                }

            });


            // Display values
            document.getElementById("totalStudents")
                .textContent = total;

            document.getElementById("placedStudents")
                .textContent = placed;

            document.getElementById("notPlacedStudents")
                .textContent = notPlaced;
        }


        /* =========================================
           INITIAL STATISTICS
        ========================================= */

        updateStatistics();

    </script>

</body>
</html>
